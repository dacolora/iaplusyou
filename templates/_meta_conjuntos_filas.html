{# Filas de la tabla «Conjuntos» de la pestaña «Meta»: incluidas en _meta_panel.html (la primera página) y solas como
   respuesta de «Ver más» (meta_rendimiento.rutas.ver_conjuntos). Solo <tr>. Contexto: `mr` (panel.contexto o
   panel.conjuntos_pagina) y `cliente`. Sin <script>. #}
{% import "_meta_macros.html" as mx %}
{% for s in mr.conjuntos %}
<tr>
  <td class="tw-nombre">
    <strong>{{ s.nombre or s.adset_id }}</strong>
    <small>{{ s.campana or s.campaign_id or '—' }}</small>
    {% if not mr.actual %}<small>{{ mx.cuenta(s.cuenta) }}</small>{% endif %}
  </td>
  <td>{{ mx.estado(s.estado, mr.estados) }}</td>
  <td>{{ mx.aprendizaje(s.aprendizaje, mr.aprendizaje) }}</td>
  <td>{{ mx.presupuesto(s) }}</td>
  <td>{{ mx.monto(s.gasto, s.moneda) }}</td>
  <td>{{ mx.roas(s.m.roas) }}</td>
  <td>{{ mx.monto(s.m.cpa, s.moneda) }}</td>
</tr>
{% endfor %}
{% if mr.hay_mas_conjuntos %}
<tr class="meta-mas">
  <td colspan="7"><button type="button" class="btn-sm" data-meta-mas="{{ url_for('meta_rendimiento.ver_conjuntos', cliente=cliente, dias=mr.dias, cuenta=mr.actual.ad_account_id if mr.actual else none, pagina=mr.pagina_conjuntos + 1) }}">{{ _('Ver más') }}</button></td>
</tr>
{% endif %}
