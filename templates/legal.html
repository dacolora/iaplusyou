{% extends "base.html" %}
{% block title %}{{ titulo }} · Creatv Galadsy{% endblock %}
{% block content %}
<section class="hero aparece">
  <div class="hero-texto">
    <span class="marca-logo" role="img" aria-label="Creatv Galadsy"></span>
    <h1>{{ titulo }}</h1>
    <p class="hero-sub">{{ _('Última actualización: %(fecha)s', fecha=actualizado) }}</p>
  </div>
</section>
<article class="legal aparece" style="max-width:820px;line-height:1.6;">
  {{ cuerpo | safe }}
</article>
{% endblock %}
