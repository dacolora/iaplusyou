{# Alta rápida de producto que acompaña a _selector_productos.html. Va FUERA
   del <form> principal de la pestaña (los formularios no se anidan). Mismos
   parámetros sel_id / sel_volver. #}
<form method="post" action="{{ url_for('crear_producto', cliente=cliente) }}" enctype="multipart/form-data"
      class="form-nueva-idea" id="sel-{{ sel_id }}-add" hidden style="margin-top:.8rem;">
  <input type="hidden" name="volver" value="{{ sel_volver }}">
  <label class="campo-label">{{ _('Nuevo producto') }}</label>
  <div class="fila-campos-idea">
    <input type="text" name="nombre" placeholder="{{ _('Nombre (ej. HOriginal Rose)') }}" required>
    <input type="text" name="descripcion" placeholder="{{ _('Descripción corta (opcional)') }}">
  </div>
  <label class="campo-label" style="margin-top:.6rem;display:block;">{{ _('Fotos del producto (varias, con fondo limpio)') }}</label>
  <input type="file" name="imagenes" accept=".jpg,.jpeg,.png,.webp" multiple required>
  <p class="vacio" style="font-size:.76rem;">{{ _('Tipo y mapa corporal se ajustan después en FlowCatálogo.') }}</p>
  <button class="btn-generar btn-sm" type="submit" style="margin-top:.6rem;">{{ _('Crear producto') }}</button>
  <button class="btn-rechazar btn-sm" type="button" id="sel-{{ sel_id }}-add-cancelar" style="margin-left:.4rem;">{{ _('Cancelar') }}</button>
</form>

<script>
  (function () {
    var id = "sel-{{ sel_id }}";
    var detalle = document.getElementById(id);
    var resumen = document.getElementById(id + "-resumen");
    var buscador = document.getElementById(id + "-buscador");
    var vacio = document.getElementById(id + "-vacio");
    var nuevo = document.getElementById(id + "-add");
    var nuevoBtn = document.getElementById(id + "-add-btn");
    var nuevoCancelar = document.getElementById(id + "-add-cancelar");
    var grilla = document.getElementById(id + "-grilla");
    var precarga = detalle.querySelector('[data-selector-marcados]');
    var opciones = [];
    var cargado = false, cargando = false;
    function leerOpciones() {
      opciones = Array.prototype.slice.call(detalle.querySelectorAll('.producto-opcion, [data-selector-marcados] label'));
      total = opciones.length;
    }
    var modo = detalle.dataset.modo;
    var sinProducto = document.getElementById(id + '-required');
    if (modo === 'radio') {
      detalle.closest('form').addEventListener('submit', function (ev) {
        if (detalle.querySelector('input[name="producto_id"]:checked')) return;
        ev.preventDefault();
        sinProducto.hidden = false;
        detalle.open = true;
        cargar();
      });
    }
    var total = opciones.length;
    var textoInicial = resumen.textContent;
    // Crear abre el catálogo en un <dialog> (sel_dialogo): el resumen no es un
    // <summary> y «+ Nuevo producto» (su formulario vive fuera del diálogo)
    // cierra el diálogo para que el formulario se vea.
    var enDialogo = detalle.tagName !== "DETAILS";

    // El resumen dice qué quedó elegido aunque el panel esté cerrado.
    function actualizarResumen() {
      var marcados = opciones.filter(function (l) { return l.querySelector("input").checked; });
      if (!marcados.length) { resumen.textContent = textoInicial; return; }
      if (modo === "radio") {
        sinProducto.hidden = true;
        resumen.textContent = {{ _('Producto: %(nombre)s — cambiar →', nombre='__NOMBRE__')|tojson }}.replace('__NOMBRE__', marcados[0].querySelector("input").dataset.nombre);
        detalle.open = false;
      } else {
        var nombres = marcados.map(function (l) { return l.querySelector("input").dataset.nombre; });
        var lista = nombres.length <= 3 ? nombres.join(", ") : {{ _('%(n)s productos', n='__N__')|tojson }}.replace('__N__', nombres.length);
        resumen.textContent = enDialogo ? {{ _('Elegidos: %(lista)s', lista='__LISTA__')|tojson }}.replace('__LISTA__', lista) : lista + {{ _(' — cambiar →')|tojson }};
      }
    }
    detalle.addEventListener('change', actualizarResumen);
    leerOpciones();
    actualizarResumen();

    function cargar() {
      if (cargado || cargando) return;
      cargando = true;
      var url = new URL(grilla.dataset.url, location.href);
      detalle.querySelectorAll('input:checked').forEach(function (input) { url.searchParams.append('marcado', input.value); });
      grilla.textContent = {{ _('Cargando…')|tojson }};
      fetch(url.toString(), {headers: {'X-Requested-With': 'fetch'}})
        .then(function (r) {
          if (r.status === 401 || r.status === 403 || r.redirected) {
            var error = new Error(); error.sesionVencida = true; throw error;
          }
          if (!r.ok) throw new Error(); return r.text();
        })
        .then(function (html) {
          // El estado actual manda: puede haberse quitado una precarga mientras llegaba el pedido.
          var marcados = Array.prototype.map.call(detalle.querySelectorAll('input:checked'), function (i) { return i.value; });
          grilla.innerHTML = html;
          grilla.querySelectorAll('input').forEach(function (i) { i.checked = marcados.indexOf(i.value) !== -1; });
          precarga.innerHTML = '';
          cargado = true;
          leerOpciones();
          actualizarResumen();
          filtrar();
          detalle.dispatchEvent(new Event('catalogo-cargado', {bubbles: true}));
        })
        .catch(function (error) {
          grilla.innerHTML = '';
          var aviso = document.createElement('p'); aviso.className = 'vacio';
          grilla.appendChild(aviso);
          if (error.sesionVencida) {
            aviso.textContent = {{ _('Tu sesión venció. Vuelve a entrar para continuar.')|tojson }};
            var entrar = document.createElement('a'); entrar.className = 'btn-sm';
            entrar.href = {{ url_for('login')|tojson }}; entrar.textContent = {{ _('Entrar')|tojson }};
            grilla.appendChild(entrar);
            return;
          }
          aviso.textContent = {{ _('No pude cargar el catálogo. Intenta de nuevo.')|tojson }};
          var reintentar = document.createElement('button'); reintentar.type = 'button'; reintentar.className = 'btn-sm';
          reintentar.textContent = {{ _('Reintentar')|tojson }};
          reintentar.addEventListener('click', cargar);
          grilla.appendChild(reintentar);
        })
        .finally(function () { cargando = false; });
    }
    if (enDialogo) {
      var dialogo = detalle.closest('dialog');
      dialogo.addEventListener('catalogo-abrir', cargar);
    } else {
      detalle.addEventListener('toggle', function () { if (detalle.open) cargar(); });
    }

    function filtrar() {
      var q = buscador.value.trim().toLowerCase();
      var visibles = 0;
      opciones.forEach(function (l) {
        var ok = !q || (l.dataset.nombre || '').indexOf(q) !== -1;
        l.hidden = !ok;
        if (ok) visibles++;
      });
      grilla.querySelectorAll('.producto-grupo').forEach(function (g) { g.hidden = !g.querySelector('.producto-opcion:not([hidden])'); });
      vacio.style.display = (visibles === 0 && total > 0) ? 'block' : 'none';
    }
    if (buscador) buscador.addEventListener('input', filtrar);
    nuevoBtn.addEventListener("click", function () {
      if (enDialogo && detalle.closest("dialog")) detalle.closest("dialog").close();
      nuevo.hidden = false;
      if (enDialogo) nuevo.scrollIntoView({block: "center"});
      nuevo.querySelector("input[name=nombre]").focus();
    });
    nuevoCancelar.addEventListener("click", function () { nuevo.hidden = true; });
  })();
</script>
