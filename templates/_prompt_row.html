<div class="prompt-row">
  <div class="prompt-row-num">{{ p.numero }}</div>
  <form method="post" action="{{ url_for('guardar_prompt', cliente=cliente, prompt_id=p.id) }}" class="prompt-row-form">
    <textarea name="prompt" rows="2">{{ p.prompt }}</textarea>

    <div class="prompt-row-controls">
      <select name="model" class="mini-select">
        {% for m in modelos %}
        <option value="{{ m }}" {% if m == p.model %}selected{% endif %}>{{ m }}</option>
        {% endfor %}
      </select>
      <select name="aspect_ratio" class="mini-select" title="Proporción de la imagen/video">
        {% for ar in aspect_ratios %}
        <option value="{{ ar }}" {% if ar == p.aspect_ratio %}selected{% endif %}>{{ ar }}</option>
        {% endfor %}
      </select>
      <span class="costo-mini">
        {% if p.credits is not none %}~{{ "%.2f"|format(p.credits) }} cr imagen (${{ "%.2f"|format(p.usd) }}){% else %}costo desconocido{% endif %}
      </span>
      {% for pl in p.platforms %}
      <span class="plataforma-chip">{{ pl }}</span>
      {% else %}
      <span class="plataforma-chip">sin plataformas</span>
      {% endfor %}
    </div>

    <div class="prompt-row-acciones">
      <button class="btn-guardar btn-sm" type="submit">Guardar</button>
      <button
        class="btn-aprobar btn-sm"
        type="submit"
        formaction="{{ url_for('aprobar_prompt', cliente=cliente, prompt_id=p.id) }}"
        onclick="return confirm('¿Generar una imagen de referencia con estos valores? Esto gasta créditos de Higgsfield (barato, ~1.5cr).');"
      >Aprobar y generar imagen</button>
    </div>
  </form>
  <form
    method="post"
    action="{{ url_for('rechazar_prompt', cliente=cliente, prompt_id=p.id) }}"
    onsubmit="return confirm('¿Descartar este prompt? No se genera nada.');"
    class="prompt-row-descartar"
  >
    <button class="btn-rechazar btn-sm" type="submit" title="Descartar">✕</button>
  </form>
</div>
