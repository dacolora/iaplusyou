{# «Tus anuncios» de la pestaña Rendimiento: UNA galería con los anuncios de Triple Whale y de Meta (spec
   2026-10-08-triple-whale-tarjetas-analisis §2, §5; desde Rendimiento E2 tarea 4, 2026-10-10, con las dos fuentes:
   pestana_rendimiento/galeria.py). Sin <script>: el JS vive en _tab_rendimiento.html.
   Parámetros de las macros: `tw` = los diccionarios de textos (etiquetas_veredicto, frases_veredicto, tendencias,
   vacios_anillo, problemas, fortalezas, etiquetas_pieza: `pestana_rendimiento.panel.etiquetas`); `params` = el alcance
   de la pestaña en las URL ({entrada, dias, canal}), que va en cada formulario como campos ocultos y en las URL de la
   galería y de la tarjeta; `params_tw` = el de las rutas de Triple Whale ({dias, canal, tienda}), solo para «Guardar
   en Referentes». Las URL salen de las rutas de la pestaña (`rendimiento.*`) con la fuente de cada anuncio
   (`a.fuente`: "tw" | "meta"), y la moneda de cada tarjeta es la suya (`a.moneda`).
   `data-tarjeta-url` lleva el alcance como query aparte (`|urlencode`): en esa ruta `<canal>` del camino es el
   canal del anuncio y `canal` de la query es el filtro del panel, y url_for no admite los dos.
   Una tarjeta de Meta (regla 4 de la galería): la misma macro, con su cuenta en el sobretítulo, «según Meta» en el
   resultado y sin «Meta reporta» (R12) ni «Guardar en Referentes» (PND-284). #}

{% import "_meta_macros.html" as mx %}

{#- Los campos ocultos con el alcance de la pestaña (o el de Triple Whale, para sus rutas). -#}
{% macro campos_alcance(params) -%}
{% for k, v in params.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
{%- endmacro %}

{% import "_componentes.html" as cx %}

{#- `detalle` es la cifra cruda en palabras («30 % se queda 3 s») o "" si no hay valor. Sin percentil (cuenta chica,
    pocos datos) el anillo dice «—» pero la cifra y el porqué siguen debajo y en el aria-label. -#}
{% macro anillo_tw(r, etiqueta, detalle, canal_nombre, tw) -%}
{%- set pct = r.pct if r and r.pct is not none else none -%}
{%- set razon = (tw.vacios_anillo.get(r.vacio) | traducir) if pct is none and r and r.vacio else '' -%}
<div class="tw-anillo tw-anillo-{{ (r.nivel if r and r.nivel else 'vacio') }}" role="img"
     aria-label="{% if pct is not none %}{{ _('%(etiqueta)s: mejor que el %(pct)s %% de tus anuncios de %(canal)s', etiqueta=etiqueta, pct=pct, canal=canal_nombre) }}{% else %}{{ etiqueta }}:{% if not detalle and not razon %} —{% endif %}{% endif %}{% if detalle %}{% if pct is not none %} ·{% endif %} {{ detalle }}{% endif %}{% if razon %}{% if detalle %} ·{% endif %} {{ razon }}{% endif %}">
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="tw-anillo-fondo" cx="18" cy="18" r="15.9"/>
    {% if pct is not none %}<circle class="tw-anillo-valor" cx="18" cy="18" r="15.9" stroke-dasharray="{{ pct }} 100" transform="rotate(-90 18 18)"/>{% endif %}
    <text x="18" y="21.5" text-anchor="middle">{{ pct if pct is not none else '—' }}</text>
  </svg>
  <span class="tw-anillo-etiqueta">{{ etiqueta }}</span>
  <small>{{ detalle }}{% if razon %}{% if detalle %} · {% endif %}{{ razon }}{% endif %}</small>
</div>
{%- endmacro %}

{% macro tarjeta_anuncio(a, cliente, params, params_tw, tw) -%}
{%- set am = a.m -%}
{%- set an = a.anillos or {} -%}
{%- set fuente = 'meta' if a.fuente == 'meta' else 'tw' -%}
{%- set de_meta = fuente == 'meta' -%}
{%- set moneda = a.moneda or '' -%}
{%- set canal_nombre = a.canal | tw_canal -%}
{%- set clave = ('meta-' if de_meta else '') ~ a.canal ~ '-' ~ a.ad_id -%}
{%- set fila = a.analisis -%}
{%- set url_analizar = url_for('rendimiento.analizar_anuncio', cliente=cliente, fuente=fuente, canal=a.canal, ad_id=a.ad_id) -%}
<article class="tw-tarjeta tw-tarjeta-{{ a.veredicto }}" id="tw-tarjeta-{{ clave }}" data-fuente="{{ fuente }}"
         data-tarjeta-url="{{ url_for('rendimiento.ver_tarjeta', cliente=cliente, fuente=fuente, canal=a.canal, ad_id=a.ad_id) }}?{{ params | urlencode }}">
  <div class="tw-tarjeta-medio">
    {% if a.medio.video %}
    <video src="{{ a.medio.video }}" {% if a.medio.poster %}poster="{{ a.medio.poster }}"{% endif %} controls playsinline preload="none" data-precarga></video>
    {% elif a.medio.imagen %}
    <img src="{{ a.medio.imagen }}" alt="{{ a.nombre or a.ad_id }}" loading="lazy" referrerpolicy="no-referrer"{% if a.medio.miniatura %} class="tw-medio-miniatura"{% endif %}>
    {% else %}
    <div class="tw-tarjeta-sin-medio">{{ canal_nombre }}</div>
    {% endif %}
    {% if a.medio.enlace %}<a class="tw-tarjeta-enlace" href="{{ a.medio.enlace }}" target="_blank" rel="noopener noreferrer">{{ _('Ver en %(canal)s', canal=canal_nombre) }}</a>{% endif %}
  </div>
  <div class="tw-tarjeta-cuerpo">
    <div class="tw-tarjeta-cabeza">
      <div class="tw-tarjeta-titulos">
        <small class="tw-sobretitulo">{% if de_meta and a.cuenta %}{{ mx.cuenta(a.cuenta) }}{% else %}{{ canal_nombre }}{% endif %}{% if a.campana %} · {{ a.campana }}{% endif %}</small>
        <strong class="tw-tarjeta-nombre">{{ a.nombre or a.ad_id }}</strong>
        <p class="tw-frase" title="{{ a.motivo }}">{{ tw.frases_veredicto[a.veredicto] | traducir }}</p>
      </div>
      <span class="tw-resultado tw-resultado-{{ a.veredicto }}">
        {%- if am.pedidos and am.pedidos > 0 and de_meta -%}{{ ngettext('ROAS %(roas)s× según Meta · %(num)s compra', 'ROAS %(roas)s× según Meta · %(num)s compras', am.pedidos | round | int, roas=am.roas | roas) }}
        {%- elif am.pedidos and am.pedidos > 0 -%}{{ _('ROAS %(roas)s× · %(n)s ventas', roas=am.roas | roas, n=am.pedidos | tw_ventas) }}
        {%- elif am.gasto > 0 -%}{{ _('Gastó %(g)s sin ventas', g=am.gasto | dinero(moneda)) }}
        {%- else -%}{{ _('Sin ventas todavía') }}{%- endif -%}
      </span>
    </div>
    <div class="tw-anillos">
      {{ anillo_tw(an.gancho, _('Gancho'), _('%(p)s se queda 3 s', p=an.gancho.valor | tw_pct(0)) if an.gancho and an.gancho.valor is not none else '', canal_nombre, tw) }}
      {{ anillo_tw(an.retencion, _('Retención'), _('%(p)s lo ve completo', p=an.retencion.valor | tw_pct(0)) if an.retencion and an.retencion.valor is not none else '', canal_nombre, tw) }}
      {{ anillo_tw(an.clic, _('Clic'), _('CTR %(p)s', p=an.clic.valor | tw_pct(1, false)) if an.clic and an.clic.valor is not none else '', canal_nombre, tw) }}
      {{ anillo_tw(an.compra, _('Compra'), _('%(p)s compra', p=an.compra.valor | tw_pct(1)) if an.compra and an.compra.valor is not none else '', canal_nombre, tw) }}
    </div>
    <dl class="tw-cifras">
      <div><dt>{{ _('Costo por venta') }}</dt><dd>{% if am.cpa %}{{ am.cpa | dinero(moneda) }}{% else %}—{% endif %}{% if a.cpa_canal %} <small>{{ _('canal: %(c)s', c=a.cpa_canal | dinero(moneda)) }}</small>{% endif %}</dd></div>
      <div><dt>{{ _('Tendencia (7 días)') }}</dt><dd class="tw-tendencia-{{ a.tendencia or 'nada' }}">{% if a.tendencia %}{{ tw.tendencias[a.tendencia] | traducir }}{% else %}—{% endif %}</dd></div>
      {#- R12 (spec 2026-10-09): lo que Meta le informa a Triple Whale de este anuncio (valor_canal / gasto); sin dato, nada.
          Solo en tarjetas de Triple Whale: en una de Meta la cifra de arriba ya es la de Meta. -#}
      {% if not de_meta and a.canal == 'facebook-ads' and am.roas_canal %}<div><dt>{{ _('Meta reporta') }}</dt><dd>{{ am.roas_canal | roas }}× <small>{{ _('cada uno cuenta las ventas con su propio Pixel') }}</small></dd></div>{% endif %}
      {#- NVP (spec 2026-10-09-nvp-visitantes-nuevos §4.1): las sumas del periodo de ESTE anuncio, ya en `a.m`. En una
          tarjeta de Meta salen de la copia de Triple Whale (galeria.py, regla 5) y sin Triple Whale no se dice. -#}
      {% if not a.sin_nvp %}<div><dt>{{ _('Visitantes nuevos (NVP)') }}</dt><dd>{{ cx.nvp(am.visitantes_nuevos, am.visitantes) }}</dd></div>{% endif %}
    </dl>
    {% if a.fortalezas or a.problemas %}
    <ul class="tw-razones">
      {% for f in a.fortalezas[:3] %}<li class="tw-razon tw-razon-ok">✓ {{ tw.fortalezas[f] | traducir }}</li>{% endfor %}
      {% for p in a.problemas[:3] %}<li class="tw-razon tw-razon-mal" title="{{ tw.problemas[p][1] | traducir }}">✗ {{ tw.problemas[p][0] | traducir }}</li>{% endfor %}
    </ul>
    {% endif %}
    {#- .get('copy'): ni a.creativo.copy ni a.creativo['copy'] (sin la clave) sirven, Jinja cae al método dict.copy. -#}
    {% set copy_anuncio = a.creativo.get('copy') %}
    {% if a.creativo.titulo or copy_anuncio %}
    <details class="tw-texto-anuncio"><summary>{{ _('Texto del anuncio') }}</summary>
      {% if a.creativo.titulo %}<p><strong>{{ a.creativo.titulo }}</strong></p>{% endif %}
      {% if copy_anuncio %}<p class="tw-copy">{{ copy_anuncio }}</p>{% endif %}
    </details>
    {% endif %}
    {% if a.creatv %}<small><a href="#experimentos?exp={{ a.creatv.experimento_id }}">{{ _('Hecho en Creatv · %(exp)s', exp=a.creatv.experimento) }}</a></small>{% endif %}
    <div class="tw-tarjeta-ia">
      {% if a.job_analisis %}
      <div class="tw-progreso">
        <div class="barra-progreso" id="tw-anuncio-{{ clave }}" data-poll-job="{{ a.job_analisis }}" data-poll-al-terminar="evento"><div class="barra-progreso-fill" style="width:0%"></div></div>
        <div class="progreso-texto">{{ _('Analizando con IA…') }}</div>
      </div>
      {% elif fila and fila.estado == 'lista' %}
      <p class="tw-ia-frase">{{ fila.resultado.frase }}</p>
      {% if a.analisis_viejo %}<small class="vacio">{{ _('Con los datos del %(desde)s al %(hasta)s; desde entonces cambió.', desde=fila.desde, hasta=fila.hasta) }}</small>
      {% elif a.analisis_otro_alcance %}<small class="vacio">{{ _('Analizado con los datos del %(desde)s al %(hasta)s', desde=fila.desde, hasta=fila.hasta) }}</small>{% endif %}
      <button type="button" class="btn-sm" data-tw-ver-analisis data-url="{{ url_for('triple_whale.analisis_detalle', cliente=cliente, aid=fila.id) }}">{{ _('Ver el análisis') }}</button>
      <div class="tw-analisis-detalle" hidden></div>
      {#- D3 (spec §7.1): con el estado en Crear de la más reciente (piezas_de_analisis va por id de pieza). -#}
      {% if a.piezas_mejora %}{% set ultima = a.piezas_mejora | last %}<small>{{ ngettext('Ya se hizo %(num)s pieza con esta mejora', 'Ya se hicieron %(num)s piezas con esta mejora', a.piezas_mejora | length) }} · {{ _('la última: %(estado)s', estado=(tw.etiquetas_pieza or {}).get(ultima.estado, ultima.estado) | traducir) }}</small>{% endif %}
      {% elif fila and fila.estado == 'error' %}
      {#- `interrumpido`: una fila en_cola/analizando sin tarea viva (panel.elegir_analisis) no bloquea: es un error. -#}
      <p class="tag-error">{{ fila.error or (_('Se interrumpió antes de terminar.') if fila.interrumpido else _('El análisis falló.')) }}</p>
      {% endif %}
      {#- `ofrecer_analisis` (panel.elegir_analisis) es la misma regla que decide el lote: sin tarea viva, con datos, sin
          uno fresco de este alcance ni uno listo de otro. -#}
      {% if a.ofrecer_analisis %}
      {% set precio = a.precio_analisis.texto if a.precio_analisis else _('precio no disponible') %}
      {% set etiqueta = _('Intentar otra vez') if fila and fila.estado == 'error' else (_('Analizar otra vez') if fila else _('Cómo mejorarlo')) %}
      <form method="post" class="tw-analizar" data-tw-async action="{{ url_analizar }}"
            data-confirmar="{{ _('¿Analizar «%(nombre)s» con IA? Costo: %(precio)s', nombre=a.nombre or a.ad_id, precio=precio) }}">
        {{ campos_alcance(params) }}
        <button type="submit" class="btn-generar btn-sm">{{ etiqueta }} · {{ precio }}</button>
      </form>
      {% endif %}
      {#- Un análisis de otra tienda u otro periodo no se da por viejo (§6.6): se ofrece, discreto, volver a pagarlo con los datos de ahora. -#}
      {% if a.analisis_otro_alcance and not a.job_analisis and a.veredicto != 'sin_datos' %}
      {% set precio_otro = a.precio_analisis.texto if a.precio_analisis else _('precio no disponible') %}
      <form method="post" class="tw-analizar" data-tw-async action="{{ url_analizar }}"
            data-confirmar="{{ _('¿Analizar «%(nombre)s» con IA? Costo: %(precio)s', nombre=a.nombre or a.ad_id, precio=precio_otro) }}">
        {{ campos_alcance(params) }}
        <button type="submit" class="btn-xs">{{ _('Analizar con estos datos') }} · {{ precio_otro }}</button>
      </form>
      {% endif %}
      {#- «Guardar en Referentes» sigue en triple_whale/rutas.py con el alcance de Triple Whale; para Meta, PND-284. -#}
      {% if not de_meta and a.veredicto in ('ganador', 'prometedor') and (a.medio.imagen or a.medio.poster) %}
      <form method="post" action="{{ url_for('triple_whale.anuncio_referente', cliente=cliente, canal=a.canal, ad_id=a.ad_id) }}">
        {{ campos_alcance(params_tw) }}
        <button type="submit" class="btn-xs">{{ _('Guardar en Referentes') }}</button>
      </form>
      {% endif %}
    </div>
  </div>
</article>
{%- endmacro %}

{% macro tarjetas_pagina(g, cliente, params, params_tw, tw) -%}
{% for a in g.tarjetas %}{{ tarjeta_anuncio(a, cliente, params, params_tw, tw) }}{% endfor %}
{% if g.hay_mas %}<button type="button" class="btn-sm tw-ver-mas" data-tw-mas data-pagina="{{ g.pagina + 1 }}">{{ _('Ver más') }}</button>{% endif %}
{%- endmacro %}

{#- El bloque entero (chips + lote + rejilla) vive en un solo elemento: al cambiar de filtro el JS lo reemplaza completo
    (ruta `rendimiento.ver_galeria` con `entera=1`), así el formulario del lote y su precio siempre son los del filtro
    que se ve. Cada clave del lote es "<fuente>:<canal>:<ad_id>". -#}
{% macro galeria(g, cliente, params, params_tw, tw) -%}
<div class="tw-galeria-bloque" data-url="{{ url_for('rendimiento.ver_galeria', cliente=cliente, **params) }}">
<div class="tw-galeria-barra">
  <div class="tw-filtros" role="group" aria-label="{{ _('Filtrar anuncios') }}">
    {% set nombres = {"": _('Todos'), "ganador": _('Ganadores'), "prometedor": _('Prometedores'), "en_prueba": _('En prueba'),
                      "perdedor": _('Perdedores'), "cansando": _('Se están cansando'), "sin_datos": _('Muy pocos datos')} %}
    {% for f, nombre in nombres.items() %}{% if f == '' or g.conteo_filtros[f] %}
    <button type="button" class="chip{% if g.veredicto == f %} activo{% endif %}" data-tw-galeria-filtro="{{ f }}">{{ nombre }} ({{ g.conteo_filtros[f] }})</button>
    {% endif %}{% endfor %}
  </div>
  {% if g.lote.n %}
  <form method="post" class="tw-analizar-lote" action="{{ url_for('rendimiento.analizar_lote', cliente=cliente) }}"
        data-confirmar="{{ _('¿Analizar con IA los %(n)s anuncios que más gastaron? Costo total: %(precio)s', n=g.lote.n, precio=g.lote.precio.texto) }}">
    {{ campos_alcance(params) }}
    <input type="hidden" name="veredicto" value="{{ g.veredicto }}">
    {#- Lo que se confirmó: el servidor cobra solo estos (y solo si siguen elegibles), no «los próximos N». -#}
    {% for clave in g.lote.claves %}<input type="hidden" name="clave" value="{{ clave }}">{% endfor %}
    <button type="submit" class="btn-sm">{{ _('Analizar los %(n)s que más gastaron · %(precio)s', n=g.lote.n, precio=g.lote.precio.texto) }}</button>
  </form>
  {% endif %}
</div>
<div class="tw-galeria" id="tw-galeria" data-url="{{ url_for('rendimiento.ver_galeria', cliente=cliente, **params) }}" data-veredicto="{{ g.veredicto }}">
  {% if g.tarjetas %}{{ tarjetas_pagina(g, cliente, params, params_tw, tw) }}{% else %}<p class="vacio">{{ _('Ningún anuncio en este filtro.') }}</p>{% endif %}
</div>
</div>
{%- endmacro %}
