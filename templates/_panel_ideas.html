{% from "_angulo_editor.html" import editor_angulo %}
{# Pestaña «Ideas» del panel (spec 2026-09-27, entrega 2). Fragmento incluido
   por _sprint_panel.html: sin <script> propio, el JS vive en
   sprint_detalle.html (delegación sobre `panel`, igual que el resto del
   panel). CONSCIENCIAS_CLIENTE/SOFISTICACIONES_CLIENTE vienen de
   doctrina.globales_plantilla(), registrado en Jinja para toda la app. #}
<div class="panel-tab" data-tab="ideas" hidden>
  <section class="mercado-campana">
    <label class="campo-label" for="persona-conciencia-{{ c.id }}">Qué tanto sabe {{ c.persona_nombre }}</label>
    <select id="persona-conciencia-{{ c.id }}" data-persona-conciencia
            data-url="{{ url_for('sprints.persona_conciencia', cliente=cliente, pid=c.persona_id) }}">
      <option value="">Que Claude lo decida</option>
      {% for clave, texto in CONSCIENCIAS_CLIENTE.items() %}
      <option value="{{ clave }}" {% if nivel_persona == clave %}selected{% endif %}>{{ texto }}</option>
      {% endfor %}
    </select>
    <small class="vacio">Es la misma persona en todas sus campañas: cambiarlo aquí la cambia en todas. <span class="persona-guardado" hidden>Guardado</span></small>
    {% if c.consciencia and CONSCIENCIAS_CLIENTE.get(c.consciencia) %}
    <p class="vacio">Para las ideas de esta campaña manda la de la campaña: {{ CONSCIENCIAS_CLIENTE[c.consciencia] }} (arriba, en «Armar» › Enfoque).</p>
    {% endif %}
    <p class="vacio">Promesas parecidas que ya vio el cliente de {{ c.catalogo_id }}:
      {% if sof_producto %}{{ sof_producto }} · {{ SOFISTICACIONES_CLIENTE[sof_producto] }}{% else %}Claude lo decide{% endif %}
      (se cambia en Catálogo).</p>
  </section>

  <section class="sprint-refs-progreso">
    <strong>{{ conteo.videos_aprobados }} de {{ c.n_videos }} videos · {{ conteo.imagenes_aprobadas }} de {{ c.n_imagenes }} imágenes aprobadas</strong>
    <p class="vacio">Claude propone ideas con la persona, el producto, la temporada, tus referentes y la guía de marca. Aprueba las que sirvan; solo esas se generan, y solo cuando pulses «Generar lote» con el costo a la vista.</p>
  </section>

  <div class="acciones">
    <button type="button" class="btn-generar btn-sm" data-ideas-proponer="{{ url_for('sprints.ideas_proponer', cliente=cliente, sid=sprint.id, cid=c.id) }}"
            {% if trabajo_ideas or (conteo.faltan_videos + conteo.faltan_imagenes) == 0 %}disabled{% endif %}>
      Proponer las que faltan ({{ conteo.faltan_videos }} videos, {{ conteo.faltan_imagenes }} imágenes)
    </button>
    <button type="button" class="btn-sm" data-ideas-proponer="{{ url_for('sprints.ideas_proponer', cliente=cliente, sid=sprint.id, cid=c.id) }}"
            data-mas="3" {% if trabajo_ideas %}disabled{% endif %}>Proponer 3 videos más</button>
    <button type="button" class="btn-sm" data-ideas-proponer="{{ url_for('sprints.ideas_proponer', cliente=cliente, sid=sprint.id, cid=c.id) }}"
            data-mas="3" data-tipo="imagen" {% if trabajo_ideas %}disabled{% endif %}>Proponer 3 imágenes más</button>
    <button type="button" class="btn-sm" data-ideas-aprobar-todas="{{ url_for('sprints.ideas_aprobar_todas', cliente=cliente, sid=sprint.id, cid=c.id) }}">Aprobar todas las propuestas</button>
    {% if conteo.pendientes_lote %}
    <button type="button" class="btn-generar btn-sm" onclick="abrirLote({{ c.id }})">Generar lote de esta campaña ({{ conteo.pendientes_lote }})</button>
    {% endif %}
    {% if trabajo_ideas %}
    <div class="barra-progreso" id="trabajo-{{ trabajo_ideas.job_id }}" data-poll-job="{{ trabajo_ideas.job_id }}"><div class="barra-progreso-fill"></div><span class="progreso-texto"></span></div>
    {% endif %}
  </div>

  <div class="sprint-ideas">
    {% for i in ideas %}
    <article class="swap-card sprint-idea sprint-idea-{{ i.estado_idea }}" data-idea data-url-campo="{{ url_for('sprints.idea_editar', cliente=cliente, cp_id=i.id) }}">
      <header class="sprint-idea-cab">
        <span class="tag-estado">{{ i.tipo }}</span>
        <input class="sprint-idea-titulo" data-campo="titulo" value="{{ i.titulo }}" {% if not i.sin_sesion %}readonly{% endif %}>
        <span class="tag-estado estado-sprint estado-sprint-{{ 'ideas_aprobadas' if i.estado_idea == 'aprobada' else ('completada' if not i.sin_sesion else 'planeada') }}">{{ i.estado_idea }}{% if not i.sin_sesion %} · generada{% endif %}</span>
        {% if i.enfoque %}<span class="sprint-chip">{{ enfoques.get(i.enfoque, i.enfoque) }}</span>{% endif %}
        {% if i.duracion_s %}<small class="vacio">{{ i.duracion_s | int }} s</small>{% endif %}
        <span class="sprint-guardado" hidden>Guardado</span>
      </header>
      <textarea data-campo="escena" rows="3" {% if not i.sin_sesion %}readonly{% endif %}>{{ i.escena }}</textarea>
      <div class="fe-opciones">
        {% if i.tipo == "video" %}<label>Sonido <input data-campo="sonido" value="{{ i.sonido or '' }}" {% if not i.sin_sesion %}readonly{% endif %}></label>{% endif %}
        <label>Gancho <input data-campo="gancho" name="gancho" value="{{ i.gancho or '' }}" {% if not i.sin_sesion %}readonly{% endif %}></label>
        {% if i.plataformas %}<small class="vacio">{{ i.plataformas | join(', ') }}</small>{% endif %}
      </div>
      {{ editor_angulo((i.extra or {}).get('angulo'), url_for('sprints.idea_angulo', cliente=cliente, cp_id=i.id), cliente,
                       solo_lectura=not i.sin_sesion) }}
      {% if i.referencias_ids %}
      <div class="sprint-idea-refs">
        {% for rid in i.referencias_ids %}{% set r = referencias_por_id.get(rid) %}{% if r %}<img class="sprint-mini" src="{{ r.frame_url or r.url }}" alt="" title="{{ r.titulo }}">{% endif %}{% endfor %}
      </div>
      {% endif %}
      <div class="sprint-idea-acciones">
        {% if i.sin_sesion %}
          {% if i.estado_idea != "aprobada" %}
          <button type="button" class="btn-generar btn-xs" data-idea-aprobar="{{ url_for('sprints.idea_aprobar', cliente=cliente, cp_id=i.id) }}">Aprobar</button>
          {% endif %}
          {% if ((i.extra or {}).get('angulo') or {}).get('promesa') %}
            {% if i.id in reescribiendo %}
            <div class="barra-progreso" id="trabajo-{{ reescribiendo[i.id] }}" data-poll-job="{{ reescribiendo[i.id] }}"><div class="barra-progreso-fill"></div><span class="progreso-texto"></span></div>
            {% else %}
            <button type="button" class="btn-xs" data-idea-reescribir="{{ url_for('sprints.idea_reescribir', cliente=cliente, cp_id=i.id) }}">Reescribir la idea con este ángulo ({{ precio_reescribir }})</button>
            {% endif %}
          {% endif %}
          {% if i.estado_idea != "descartada" %}
          <button type="button" class="btn-xs" data-idea-otra="{{ url_for('sprints.idea_otra', cliente=cliente, cp_id=i.id) }}">Otra idea</button>
          <button type="button" class="btn-xs btn-peligro" data-idea-descartar="{{ url_for('sprints.idea_descartar', cliente=cliente, cp_id=i.id) }}">Descartar</button>
          {% endif %}
        {% else %}
          <small class="vacio">Pieza {{ i.estado or 'en cola' }}{% if i.revision != 'pendiente' %} · {{ i.revision }}{% endif %}</small>
        {% endif %}
      </div>
    </article>
    {% else %}
    <p class="vacio">Todavía no hay ideas. Pulsa «Proponer las que faltan».</p>
    {% endfor %}
  </div>
</div>
