<h2>Personajes</h2>
{% if personajes %}
<div class="personajes-row">
  {% for p in personajes %}
  <div class="personaje-thumb">
    <form
      method="post"
      action="{{ url_for('eliminar_personaje', cliente=cliente, nombre=p.nombre) }}"
      onsubmit="return confirm('¿Eliminar {{ p.nombre }}? Esto no afecta ideas ya generadas con él, pero no podrás volver a usarlo.');"
      class="personaje-eliminar"
    >
      <button type="submit" title="Eliminar">✕</button>
    </form>
    {% if p.url %}
    <a href="{{ p.video_url or p.url }}" target="_blank">
      <img src="{{ p.url }}" alt="{{ p.nombre }}">
      {% if p.tipo == 'video' %}<span class="badge-video">VIDEO</span>{% endif %}
    </a>
    {% else %}
    <a href="{{ p.video_url }}" target="_blank" class="personaje-sin-frame">
      <span>Video sin fotograma —<br>no se puede usar aún</span>
    </a>
    {% endif %}
    <div class="nombre">{{ p.nombre }}</div>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="vacio">Todavía no hay personajes para este proyecto.</p>
{% endif %}

<form method="post" action="{{ url_for('subir_personaje', cliente=cliente) }}" enctype="multipart/form-data" class="form-subir-personaje">
  <input type="file" name="imagen" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.webm" required>
  <button class="btn-generar btn-sm" type="submit">Subir personaje (imagen o video)</button>
</form>
