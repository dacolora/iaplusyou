<div class="card-video card-prompt">
  <img class="prompt-ref" src="{{ p.image_url }}" alt="referencia">
  <div class="body">
    <form method="post" action="{{ url_for('guardar_prompt', cliente=cliente, prompt_id=p.id) }}">
      <label class="campo-label">Prompt</label>
      <textarea name="prompt" rows="3">{{ p.prompt }}</textarea>

      <div class="fila-campos">
        <div>
          <label class="campo-label">Modelo</label>
          <select name="model">
            {% for m in modelos %}
            <option value="{{ m }}" {% if m == p.model %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="campo-label">Duración</label>
          <select name="duration">
            <option value="5" {% if p.duration == 5 %}selected{% endif %}>5s</option>
            <option value="10" {% if p.duration == 10 %}selected{% endif %}>10s</option>
          </select>
        </div>
        <div>
          <label class="campo-label">cfg_scale</label>
          <input type="number" name="cfg_scale" min="0" max="1" step="0.01" value="{{ p.cfg_scale }}">
        </div>
      </div>

      <div class="plataformas">
        {% for pl in p.platforms %}
        <span class="plataforma-chip">{{ pl }}</span>
        {% else %}
        <span class="plataforma-chip">sin plataformas asignadas</span>
        {% endfor %}
      </div>

      <div class="costo">
        {% if p.credits is not none %}
          ~{{ "%.2f"|format(p.credits) }} créditos (${{ "%.2f"|format(p.usd) }})
        {% else %}
          No se pudo estimar el costo
        {% endif %}
      </div>

      <div class="acciones">
        <button class="btn-guardar" type="submit">Guardar cambios</button>
        <button class="btn-aprobar" type="submit" formaction="{{ url_for('aprobar_prompt', cliente=cliente, prompt_id=p.id) }}" onclick="return confirm('¿Generar el video con estos valores? Esto gasta créditos de Higgsfield.');">Aprobar y generar</button>
      </div>
    </form>
    <form method="post" action="{{ url_for('rechazar_prompt', cliente=cliente, prompt_id=p.id) }}" onsubmit="return confirm('¿Descartar este prompt? No se genera video.');" class="form-descartar">
      <button class="btn-rechazar" type="submit">Descartar</button>
    </form>
  </div>
</div>
