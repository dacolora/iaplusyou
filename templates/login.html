{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="login-caja aparece">
  <span class="eyebrow">Creatv Machine</span>
  <h1 style="margin-bottom:.3rem;">Entrar a tu proyecto</h1>
  <p class="hero-sub" style="margin-bottom:1.4rem;">Con el usuario y la contraseña de tu empresa.</p>
  <form method="post" action="{{ url_for('login') }}" class="form-nueva-idea">
    <label class="campo-label">Usuario</label>
    <input type="text" name="usuario" autocomplete="username" required autofocus>
    <label class="campo-label" style="margin-top:.8rem;display:block;">Contraseña</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn-generar" style="margin-top:1rem;width:100%;">Entrar</button>
  </form>
  <p class="vacio" style="margin-top:1rem;font-size:.82rem;">
    ¿No tienes proyecto todavía? <a href="{{ url_for('index') }}#empezar">Crea uno en un minuto</a>.
  </p>
</section>
{% endblock %}
