{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="hero aparece">
  <div class="hero-texto">
    <span class="eyebrow">Acceso a tu proyecto</span>
    <h1>Iniciar sesión.</h1>
    <p class="hero-sub">Usuario y contraseña del proyecto al que perteneces.</p>
  </div>
</section>

<form method="post" action="{{ url_for('login') }}" class="form-nueva-idea aparece" style="max-width:22rem;">
  <label class="campo-label">Usuario</label>
  <input type="text" name="usuario" autocomplete="username" required autofocus>
  <label class="campo-label" style="margin-top:.8rem;display:block;">Contraseña</label>
  <input type="password" name="password" autocomplete="current-password" required>
  <button type="submit" style="margin-top:1rem;">Entrar</button>
</form>

<p class="vacio" style="margin-top:1rem;">
  ¿No tienes proyecto todavía? <a href="{{ url_for('index') }}">Crea uno nuevo</a>.
</p>
{% endblock %}
