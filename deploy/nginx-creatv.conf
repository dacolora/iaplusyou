# nginx delante de gunicorn — EJEMPLO versionado (spec 2026-10-01-escala-y-monitoreo §5).
# La configuración real vive en el VPS (/etc/nginx/sites-available/…): compárala con
# esta antes de copiar nada, sobre todo los certificados que puso certbot.
#
# Qué cambia frente a dejar que gunicorn sirva todo:
#   1. /static/ lo sirve nginx desde el disco: un CSS o JS ya no ocupa un hilo de
#      gunicorn (16 hilos para TODA la app), con las mismas cabeceras de caché que pone
#      dashboard._sin_cache: con ?v= (url_for) un año «immutable», el editor «no-cache».
#   2. gzip para el HTML (la página de un proyecto pesa 0,7–3 MB y comprimida ~10×
#      menos), el CSS, el JS y el JSON de los sondeos.
#   3. Un tope suave al POST de /login (fuerza bruta de contraseñas).
#   4. Listo para poner Cloudflare delante (bloque «Cloudflare» al final).
#
# Después de editar: sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=creatv_login:10m rate=10r/m;

# Con ?v=<mtime> la URL cambia en cada despliegue: un año sin volver a preguntar.
map $arg_v $creatv_cache_estatico {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

upstream creatv_web {
    server 127.0.0.1:5050;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name app.creatvmachine.com;
    # ssl_certificate / ssl_certificate_key: los que ya puso certbot en el VPS.

    # Sin tope global en la app (personajes y marca suben videos). Con Cloudflare
    # delante el plan gratis corta en 100 MB por petición.
    client_max_body_size 250m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml text/plain text/xml application/xml text/csv font/ttf;

    # --- estáticos: directo del disco -----------------------------------------
    location /static/ {
        alias /home/deploy/iaplusyou/static/;
        add_header Cache-Control $creatv_cache_estatico always;
        access_log off;
    }
    # Módulos ES del editor: se importan entre sí sin ?v=, siempre se revalidan
    # (304 barato) para que un despliegue no mezcle módulos viejos y nuevos.
    location /static/editor/ {
        alias /home/deploy/iaplusyou/static/editor/;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    # Ícono y logo: otros sitios (el panel de Meta) los piden por fetch.
    location /static/img/ {
        alias /home/deploy/iaplusyou/static/img/;
        add_header Cache-Control $creatv_cache_estatico always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # --- login: máximo 10 intentos por minuto y por IP (ráfaga de 5) -----------
    location = /login {
        limit_req zone=creatv_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://creatv_web;
        include /etc/nginx/snippets/creatv_proxy.conf;
    }

    # --- la app ----------------------------------------------------------------
    location / {
        proxy_pass http://creatv_web;
        include /etc/nginx/snippets/creatv_proxy.conf;
    }
}

server {
    listen 80;
    server_name app.creatvmachine.com;
    return 301 https://$host$request_uri;
}

# /etc/nginx/snippets/creatv_proxy.conf (crear este archivo con lo de abajo):
#
#   proxy_http_version 1.1;
#   proxy_set_header Connection "";
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   # gunicorn corta a los 120 s (deploy/gunicorn.conf.py): nginx espera un poco más.
#   proxy_read_timeout 130s;
#   proxy_send_timeout 130s;
#   # nginx recibe la respuesta entera y libera el hilo de gunicorn enseguida,
#   # aunque el navegador del cliente baje la página despacio.
#   proxy_buffering on;
#   proxy_buffers 64 16k;
#
# La app ya confía en X-Forwarded-For/-Proto solo con DETRAS_DE_PROXY=1 (ProxyFix,
# el ÚLTIMO valor, el que añade nginx).

# --- Cloudflare delante (CDN) ---------------------------------------------------
# Con el DNS de app.creatvmachine.com «proxied» (nube naranja), Cloudflare guarda en
# su borde lo que la app marca como cacheable (los estáticos con ?v=, un año) y deja
# pasar el HTML y el JSON (salen «no-store»). Para que la IP real siga llegando a la
# app (límites por IP, registro de errores) nginx debe tomarla de CF-Connecting-IP,
# SOLO si quien llama es Cloudflare. Rangos vigentes: https://www.cloudflare.com/ips/
# (revisarlos antes de copiar). Dentro del bloque `server` de 443:
#
#   set_real_ip_from 173.245.48.0/20;   set_real_ip_from 103.21.244.0/22;
#   set_real_ip_from 103.22.200.0/22;   set_real_ip_from 103.31.4.0/22;
#   set_real_ip_from 141.101.64.0/18;   set_real_ip_from 108.162.192.0/18;
#   set_real_ip_from 190.93.240.0/20;   set_real_ip_from 188.114.96.0/20;
#   set_real_ip_from 197.234.240.0/22;  set_real_ip_from 198.41.128.0/17;
#   set_real_ip_from 162.158.0.0/15;    set_real_ip_from 104.16.0.0/13;
#   set_real_ip_from 104.24.0.0/14;     set_real_ip_from 172.64.0.0/13;
#   set_real_ip_from 131.0.72.0/22;
#   set_real_ip_from 2400:cb00::/32;    set_real_ip_from 2606:4700::/32;
#   set_real_ip_from 2803:f800::/32;    set_real_ip_from 2405:b500::/32;
#   set_real_ip_from 2405:8100::/32;    set_real_ip_from 2a06:98c0::/29;
#   set_real_ip_from 2c0f:f248::/32;
#   real_ip_header CF-Connecting-IP;
#
# Los videos e imágenes NO pasan por aquí: viven en R2. Para que también salgan del
# CDN, R2_PUBLIC_BASE_URL debe ser un dominio propio del bucket (p. ej.
# https://media.creatvmachine.com), no el pub-….r2.dev: ese tiene límite de tráfico,
# Cloudflare no lo cachea y no es para producción. /admin/salud avisa si es r2.dev.
